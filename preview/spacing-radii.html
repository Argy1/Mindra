<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
  .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .demo { width: 70px; height: 70px; background: var(--biru-200); border: 1.5px solid var(--biru-500); }
  .name { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .px { font-family: var(--font-mono); font-size: 9px; color: var(--fg-4); }
</style></head><body>
<div class="row">
  <div class="item"><div class="demo" style="border-radius:6px;"></div><div class="name">xs</div><div class="px">6px</div></div>
  <div class="item"><div class="demo" style="border-radius:10px;"></div><div class="name">sm</div><div class="px">10px</div></div>
  <div class="item"><div class="demo" style="border-radius:14px;"></div><div class="name">md</div><div class="px">14px</div></div>
  <div class="item"><div class="demo" style="border-radius:20px;"></div><div class="name">lg</div><div class="px">20px</div></div>
  <div class="item"><div class="demo" style="border-radius:28px;"></div><div class="name">xl</div><div class="px">28px</div></div>
  <div class="item"><div class="demo" style="border-radius:36px;"></div><div class="name">2xl</div><div class="px">36px</div></div>
  <div class="item"><div class="demo" style="border-radius:999px;"></div><div class="name">pill</div><div class="px">∞</div></div>
</div>
<div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-4); margin-top: 12px;">Pebble-soft · buttons use pill · cards use lg · sheets use 2xl (top-only)</div>
</body></html>
