<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
  body { padding: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tile { background: white; border-radius: 20px; padding: 18px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .tile.cream { background: var(--krem-100); }
  .tile img { max-width: 100%; height: auto; }
  .cap { font-family: var(--font-mono); font-size: 10px; color: var(--fg-4); }
</style></head><body>
<div class="grid">
  <div class="tile cream">
    <img src="../assets/illustration-orb.svg" style="width: 130px;">
    <div class="cap">Breath orb · meditation hero</div>
  </div>
  <div class="tile">
    <img src="../assets/illustration-pebbles.svg" style="width: 100%; max-width: 280px;">
    <div class="cap">Pebbles · decorative row</div>
  </div>
</div>
</body></html>
