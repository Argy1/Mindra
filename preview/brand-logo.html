<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
  body { padding: 28px; }
  .row { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; align-items: stretch; }
  .lockup { background: white; border-radius: 20px; padding: 28px 24px; box-shadow: var(--shadow-sm); display: flex; align-items: center; justify-content: center; min-height: 120px; }
  .lockup.dark { background: var(--biru-800); }
  .lockup.dark img { filter: brightness(0) invert(1) opacity(0.95); }
  .lockup.cream { background: var(--krem-100); }
  .lockup img { max-width: 100%; height: auto; max-height: 56px; }
  .label { font-family: var(--font-mono); font-size: 9px; color: var(--fg-4); margin-top: 8px; text-align: center; }
  .col { display: flex; flex-direction: column; gap: 12px; }
</style></head><body>
<div class="row">
  <div>
    <div class="lockup"><img src="../assets/logo-mindra.svg"></div>
    <div class="label">Primary lockup · on cream / white</div>
  </div>
  <div class="col">
    <div>
      <div class="lockup dark" style="min-height: 56px; padding: 14px;"><img src="../assets/logo-mindra-mark.svg" style="max-height:34px;"></div>
      <div class="label">Mark · on dark</div>
    </div>
    <div>
      <div class="lockup cream" style="min-height: 56px; padding: 14px;"><img src="../assets/logo-mindra-mark.svg" style="max-height:34px;"></div>
      <div class="label">Mark · on krem</div>
    </div>
  </div>
</div>
</body></html>
