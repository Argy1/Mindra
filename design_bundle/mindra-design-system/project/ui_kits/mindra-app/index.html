<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mindra · UI Kit</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="screens.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #ECE5D5; font-family: var(--font-body); }
    .frame-wrap {
      width: 360px;
      height: 780px;
      border-radius: 44px;
      overflow: hidden;
      position: relative;
      background: #000;
      box-shadow: 0 36px 80px rgba(30,42,51,0.18), 0 0 0 1.5px rgba(30,42,51,0.10);
      padding: 8px;
      box-sizing: border-box;
    }
    .frame-inner {
      width: 100%; height: 100%;
      border-radius: 36px;
      overflow: hidden;
      position: relative;
      background: var(--surface-canvas);
    }
    /* iOS status bar (simplified — Mindra's own) */
    .ios-status {
      position: absolute; top: 0; left: 0; right: 0; z-index: 30;
      height: 46px; padding: 14px 24px 0;
      display: flex; align-items: center; justify-content: space-between;
      font-family: -apple-system, "SF Pro", system-ui, sans-serif;
      font-weight: 600; font-size: 14px; color: var(--fg-1);
      pointer-events: none;
    }
    .ios-status.dark { color: #FBF8F2; }
    .ios-status .icons { display: flex; align-items: center; gap: 5px; }
    .ios-island {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 110px; height: 32px; border-radius: 20px; background: #000; z-index: 25;
    }
    .home-bar {
      position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
      width: 124px; height: 5px; border-radius: 999px; background: rgba(30,42,51,0.28); z-index: 40;
    }
    .home-bar.dark { background: rgba(251,248,242,0.6); }
  </style>
</head>
<body>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="atoms.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>

  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    (() => {
    const { DesignCanvas, DCSection, DCArtboard,
            ScreenWelcome, ScreenHome, ScreenMood, ScreenBreath, ScreenJournal, ScreenLibrary, ScreenProfile } = window;

    function Phone({ children, dark }) {
      return (
        <div className="frame-wrap">
          <div className="frame-inner">
            <div className="ios-island"></div>
            <div className={'ios-status' + (dark ? ' dark' : '')}>
              <div>9:41</div>
              <div className="icons">
                <svg width="16" height="11" viewBox="0 0 19 12"><rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill="currentColor"/><rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill="currentColor"/><rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill="currentColor"/><rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill="currentColor"/></svg>
                <svg width="14" height="10" viewBox="0 0 17 12"><path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill="currentColor"/><path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill="currentColor"/><circle cx="8.5" cy="10.5" r="1.5" fill="currentColor"/></svg>
                <svg width="24" height="11" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="currentColor" strokeOpacity="0.5" fill="none"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/></svg>
              </div>
            </div>
            {children}
            <div className={'home-bar' + (dark ? ' dark' : '')}></div>
          </div>
        </div>
      );
    }

    const W = 360, H = 780;

    function App() {
      return (
        <DesignCanvas>
          <DCSection id="onboarding" title="Onboarding" subtitle="Pintu masuk yang lembut">
            <DCArtboard id="welcome" label="Welcome · Halo" width={W} height={H}>
              <Phone><ScreenWelcome /></Phone>
            </DCArtboard>
          </DCSection>

          <DCSection id="daily" title="Daily · Beranda & Suasana" subtitle="Pintu masuk harian — sapaan, mood check-in, latihan hari ini">
            <DCArtboard id="home" label="Home · Beranda" width={W} height={H}>
              <Phone><ScreenHome /></Phone>
            </DCArtboard>
            <DCArtboard id="mood" label="Mood · Catatan suasana" width={W} height={H}>
              <Phone><ScreenMood /></Phone>
            </DCArtboard>
            <DCArtboard id="journal" label="Journal · Refleksi" width={W} height={H}>
              <Phone><ScreenJournal /></Phone>
            </DCArtboard>
          </DCSection>

          <DCSection id="practice" title="Practice · Napas & Eksplorasi" subtitle="Sesi pernapasan dan pustaka latihan">
            <DCArtboard id="breath" label="Breath · Napas 4-7-8" width={W} height={H}>
              <Phone dark><ScreenBreath /></Phone>
            </DCArtboard>
            <DCArtboard id="library" label="Library · Jelajahi" width={W} height={H}>
              <Phone><ScreenLibrary /></Phone>
            </DCArtboard>
          </DCSection>

          <DCSection id="me" title="Me · Profil & Progress" subtitle="Streak, statistik, dan akses bantuan">
            <DCArtboard id="profile" label="Profile · Saya" width={W} height={H}>
              <Phone><ScreenProfile /></Phone>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    })();
  </script>
</body>
</html>
