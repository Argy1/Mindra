<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
  .scale { display: flex; align-items: flex-end; gap: 14px; padding: 16px 0; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .block { background: var(--biru-300); border-radius: 4px; width: 28px; }
  .name { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .px { font-family: var(--font-mono); font-size: 9px; color: var(--fg-4); }
</style></head><body>
<div class="scale">
  <div class="step"><div class="block" style="height:4px;"></div><div class="name">1</div><div class="px">4</div></div>
  <div class="step"><div class="block" style="height:8px;"></div><div class="name">2</div><div class="px">8</div></div>
  <div class="step"><div class="block" style="height:12px;"></div><div class="name">3</div><div class="px">12</div></div>
  <div class="step"><div class="block" style="height:16px;"></div><div class="name">4</div><div class="px">16</div></div>
  <div class="step"><div class="block" style="height:20px;"></div><div class="name">5</div><div class="px">20</div></div>
  <div class="step"><div class="block" style="height:24px;"></div><div class="name">6</div><div class="px">24</div></div>
  <div class="step"><div class="block" style="height:32px;"></div><div class="name">7</div><div class="px">32</div></div>
  <div class="step"><div class="block" style="height:40px;"></div><div class="name">8</div><div class="px">40</div></div>
  <div class="step"><div class="block" style="height:48px;"></div><div class="name">9</div><div class="px">48</div></div>
  <div class="step"><div class="block" style="height:64px;"></div><div class="name">10</div><div class="px">64</div></div>
  <div class="step"><div class="block" style="height:80px;"></div><div class="name">11</div><div class="px">80</div></div>
  <div class="step"><div class="block" style="height:96px;"></div><div class="name">12</div><div class="px">96</div></div>
</div>
<div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-4); margin-top: 8px;">4px base · use --space-N tokens</div>
</body></html>
