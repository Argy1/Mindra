<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
  body { padding: 22px 24px; }
  .spec { display: flex; flex-direction: column; gap: 18px; }
  .row { display: grid; grid-template-columns: 122px 1fr; align-items: baseline; gap: 18px; }
  .tag { display: flex; flex-direction: column; gap: 2px; padding-top: 3px; }
  .tag .lbl { font-family: var(--font-body); font-size: 11px; font-weight: 700; color: var(--fg-2); letter-spacing: 0.02em; }
  .tag .meta { font-family: var(--font-mono); font-size: 9.5px; color: var(--fg-4); line-height: 1.5; }
  .sample { color: var(--fg-1); }
</style></head><body>
<div class="spec">
  <div class="row">
    <div class="tag">
      <div class="lbl">H1</div>
      <div class="meta">Plus Jakarta Sans<br>24 / 31 · Bold</div>
    </div>
    <div class="sample" style="font-family: var(--font-body); font-weight: 700; font-size: 24px; line-height: 1.3; letter-spacing: -0.01em;">
      Catatan suasana hari ini
    </div>
  </div>

  <div class="row">
    <div class="tag">
      <div class="lbl">H2</div>
      <div class="meta">Plus Jakarta Sans<br>20 / 26 · SemiBold</div>
    </div>
    <div class="sample" style="font-family: var(--font-body); font-weight: 600; font-size: 20px; line-height: 1.3;">
      Tiga kalimat sebelum tidur
    </div>
  </div>

  <div class="row">
    <div class="tag">
      <div class="lbl">H3</div>
      <div class="meta">Plus Jakarta Sans<br>18 / 23 · SemiBold</div>
    </div>
    <div class="sample" style="font-family: var(--font-body); font-weight: 600; font-size: 18px; line-height: 1.3;">
      Napas 4-7-8 untuk menenangkan diri
    </div>
  </div>

  <div class="row">
    <div class="tag">
      <div class="lbl">H4</div>
      <div class="meta">Plus Jakarta Sans<br>16 / 21 · Medium</div>
    </div>
    <div class="sample" style="font-family: var(--font-body); font-weight: 500; font-size: 16px; line-height: 1.3;">
      Privat · hanya untukmu
    </div>
  </div>
</div>
</body></html>
