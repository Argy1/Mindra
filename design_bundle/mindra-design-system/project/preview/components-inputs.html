<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
  body { padding: 24px; }
  .stack { display: flex; flex-direction: column; gap: 12px; max-width: 540px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .label { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--fg-2); }
  .input, .textarea {
    font-family: var(--font-body);
    font-size: 15px;
    padding: 13px 16px;
    border-radius: 14px;
    border: 1.5px solid var(--tinta-100);
    background: white;
    color: var(--fg-1);
    outline: none;
    transition: border-color 180ms var(--ease-out-soft), box-shadow 180ms var(--ease-out-soft);
  }
  .input::placeholder, .textarea::placeholder { color: var(--tinta-300); }
  .input:focus, .textarea:focus { border-color: var(--biru-300); box-shadow: 0 0 0 4px color-mix(in oklab, var(--biru-400) 18%, transparent); }
  .input.filled { border-color: var(--biru-300); }
  .helper { font-size: 12px; color: var(--fg-4); }
  .textarea { min-height: 70px; resize: none; line-height: 1.5; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
</style></head><body>
<div class="stack">
  <div class="row2">
    <div class="field">
      <div class="label">Nama panggilan</div>
      <input class="input filled" value="Ayu" />
    </div>
    <div class="field">
      <div class="label">Waktu refleksi</div>
      <input class="input" placeholder="20.00 WIB" />
    </div>
  </div>
  <div class="field">
    <div class="label">Apa yang ada di pikiranmu?</div>
    <textarea class="textarea" placeholder="Tulis sebanyak atau sedikit yang kamu mau. Tidak ada yang menilai."></textarea>
    <div class="helper">Privat · hanya untukmu</div>
  </div>
</div>
</body></html>
