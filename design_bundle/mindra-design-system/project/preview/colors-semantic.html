<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
  body { padding: 20px 24px; }
  .group { margin-bottom: 14px; }
  .group:last-child { margin-bottom: 0; }
  .head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .head .name { font-family: var(--font-display); font-size: 18px; color: var(--fg-1); }
  .head .anchor { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-left: auto; }
  .head .desc { font-size: 11px; color: var(--fg-4); }
  .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .swatch { aspect-ratio: 1; border-radius: 9px; padding: 5px 6px 6px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
  .swatch .step { font-family: var(--font-body); font-weight: 700; font-size: 10px; }
  .swatch .hex { font-family: var(--font-mono); font-size: 8.5px; opacity: 0.85; }
  .swatch.light .step, .swatch.light .hex { color: rgba(26,26,46,0.8); }
  .swatch.dark .step, .swatch.dark .hex { color: rgba(255,255,255,0.95); }
  .swatch .star { position: absolute; top: 4px; right: 4px; font-size: 8px; font-weight: 700; padding: 1px 4px; border-radius: 3px; background: rgba(255,255,255,0.85); color: #1A1A2E; }
  .warn { font-family: var(--font-mono); font-size: 10px; color: var(--danger-700); background: var(--danger-50); padding: 6px 10px; border-radius: 8px; margin-top: 6px; display: inline-block; }
</style></head><body>
<script>
function lum(hex) {
  const c = hex.replace('#','');
  const r = parseInt(c.slice(0,2),16)/255, g = parseInt(c.slice(2,4),16)/255, b = parseInt(c.slice(4,6),16)/255;
  const f = v => v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  return 0.2126*f(r) + 0.7152*f(g) + 0.0722*f(b);
}
function ratio(a, b) { const la = lum(a)+0.05, lb = lum(b)+0.05; return la > lb ? la/lb : lb/la; }
function buildRow(rootId, items, anchorStep) {
  const root = document.getElementById(rootId);
  items.forEach(it => {
    const dark = lum(it.c) < 0.45;
    const passesAA = ratio(it.c, '#FFFFFF') >= 4.5;
    const el = document.createElement('div');
    el.className = 'swatch ' + (dark ? 'dark' : 'light');
    el.style.background = it.c;
    let badge = '';
    if (it.s === anchorStep) badge = '<span class="star">★</span>';
    else if (passesAA) badge = '<span class="star">AA</span>';
    el.innerHTML = `${badge}<div></div><div><div class="step">${it.s}</div><div class="hex">${it.c}</div></div>`;
    root.appendChild(el);
  });
}
</script>

<div class="group">
  <div class="head"><div class="name">Success</div><div class="desc">soft green · confirmations, growth</div><div class="anchor">500 = #2E8B57</div></div>
  <div class="row" id="success"></div>
</div>
<div class="group">
  <div class="head"><div class="name">Warning</div><div class="desc">amber · nudges, attention</div><div class="anchor">500 = #E07B00</div></div>
  <div class="row" id="warning"></div>
</div>
<div class="group">
  <div class="head"><div class="name">Danger</div><div class="desc">soft red · errors & crisis only</div><div class="anchor">500 = #C0392B</div></div>
  <div class="row" id="danger"></div>
  <div class="warn">Danger tidak boleh dominan. Hanya untuk error / krisis. Tidak menakutkan.</div>
</div>
<div class="group">
  <div class="head"><div class="name">Info</div><div class="desc">light blue · neutral system messages</div><div class="anchor">500 = #3498DB</div></div>
  <div class="row" id="info"></div>
</div>

<script>
buildRow('success', [
  {s:50, c:'#EAF5EE'}, {s:100,c:'#C8E4D2'}, {s:200,c:'#94CAA8'},
  {s:300,c:'#5FAE7E'}, {s:500,c:'#2E8B57'}, {s:700,c:'#1F5E3B'}, {s:900,c:'#0F2F1D'},
], 500);
buildRow('warning', [
  {s:50, c:'#FDF3E5'}, {s:100,c:'#FBE2BD'}, {s:200,c:'#F7C57A'},
  {s:300,c:'#F1A53A'}, {s:500,c:'#E07B00'}, {s:700,c:'#864800'}, {s:900,c:'#2E1800'},
], 500);
buildRow('danger', [
  {s:50, c:'#FBE9E7'}, {s:100,c:'#F4C7C2'}, {s:200,c:'#E89A92'},
  {s:300,c:'#DC6C61'}, {s:500,c:'#C0392B'}, {s:700,c:'#832720'}, {s:900,c:'#3F120E'},
], 500);
buildRow('info', [
  {s:50, c:'#EAF5FD'}, {s:100,c:'#C6E3F5'}, {s:200,c:'#8DC7EC'},
  {s:300,c:'#55ABE2'}, {s:500,c:'#3498DB'}, {s:700,c:'#1F6FA8'}, {s:900,c:'#0F3A58'},
], 500);
</script>
</body></html>
