<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
  body { padding: 22px 24px; }
  .spec { display: flex; flex-direction: column; gap: 20px; }
  .row { display: grid; grid-template-columns: 122px 1fr; align-items: baseline; gap: 18px; }
  .tag { display: flex; flex-direction: column; gap: 2px; padding-top: 4px; }
  .tag .lbl { font-family: var(--font-body); font-size: 11px; font-weight: 700; color: var(--fg-2); letter-spacing: 0.02em; }
  .tag .meta { font-family: var(--font-mono); font-size: 9.5px; color: var(--fg-4); line-height: 1.5; }
  .sample { color: var(--fg-1); }
</style></head><body>
<div class="spec">
  <div class="row">
    <div class="tag">
      <div class="lbl">Display XL</div>
      <div class="meta">Instrument Serif<br>40 / 48 · Regular</div>
    </div>
    <div class="sample" style="font-family: var(--font-display); font-weight: 400; font-size: 40px; line-height: 1.2; letter-spacing: -0.02em;">
      Halo. Senang kamu di sini.
    </div>
  </div>

  <div class="row">
    <div class="tag">
      <div class="lbl">Display L</div>
      <div class="meta">Instrument Serif<br>32 / 38 · Regular</div>
    </div>
    <div class="sample" style="font-family: var(--font-display); font-weight: 400; font-size: 32px; line-height: 1.2; letter-spacing: -0.02em;">
      Bagaimana perasaanmu sore ini?
    </div>
  </div>

  <div class="row">
    <div class="tag">
      <div class="lbl">Display M</div>
      <div class="meta">Instrument Serif<br>28 / 34 · Medium</div>
    </div>
    <div class="sample" style="font-family: var(--font-display); font-weight: 500; font-size: 28px; line-height: 1.2; letter-spacing: -0.01em;">
      Latihan singkat untuk menutup hari
    </div>
  </div>
</div>
</body></html>
