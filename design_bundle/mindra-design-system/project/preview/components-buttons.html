<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
  body { padding: 28px 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-4); width: 80px; }
  .btn {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15px;
    padding: 12px 22px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    transition: transform 120ms var(--ease-out-soft), background 180ms var(--ease-out-soft);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: var(--biru-500); color: #FBF8F2; }
  .btn-primary:hover { background: var(--biru-600); }
  .btn-secondary { background: var(--sage-500); color: #FBF8F2; }
  .btn-secondary:hover { background: var(--sage-600); }
  .btn-tertiary { background: white; color: var(--fg-1); box-shadow: var(--shadow-sm); }
  .btn-ghost { background: transparent; color: var(--biru-600); }
  .btn-ghost:hover { background: var(--biru-50); }
  .btn-warm { background: var(--hangat-500); color: #FBF8F2; }
  .btn-sm { padding: 8px 16px; font-size: 13px; }
  .btn-lg { padding: 16px 28px; font-size: 17px; }
  .btn[disabled] { opacity: 0.4; pointer-events: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
</style></head><body>
<div class="row">
  <div class="label">Primary</div>
  <button class="btn btn-primary btn-lg">Mulai latihan</button>
  <button class="btn btn-primary">Mulai</button>
  <button class="btn btn-primary btn-sm">Lanjut</button>
  <button class="btn btn-primary" disabled>Tidak aktif</button>
</div>
<div class="row">
  <div class="label">Secondary</div>
  <button class="btn btn-secondary">Catat perasaan</button>
  <button class="btn btn-tertiary">Lewati</button>
  <button class="btn btn-ghost">Pelajari lagi →</button>
  <button class="btn btn-warm">Bagikan momen</button>
</div>
</body></html>
